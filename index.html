<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Privada - Supabase</title>
    <link rel="stylesheet" href="style.css">
    <!-- SDK Global de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h1>Galería de Imágenes Privada</h1>
        
        <div id="auth-section">
            <p id="user-status">Conectando con Supabase...</p>
        </div>

        <div id="upload-section">
            <h2>Subir Nueva Imagen</h2>
            <input type="file" id="file-input" accept="image/*">
            <button id="upload-btn">Subir Imagen</button>
            <p id="upload-msg"></p>
        </div>

        <div id="gallery-section">
            <h2>Mis Imágenes Guardadas</h2>
            <div id="gallery-grid" class="grid"></div>
        </div>
    </div>

    <!-- ÚNICA etiqueta para tu app.js -->
    <script src="app.js"></script>
</body>
</html>
